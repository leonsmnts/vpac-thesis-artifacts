#cloud-config

ssh_pwauth: false

users:
  - name: ubuntu
    plain_text_passwd: 'ubuntu'
    lock_passwd: false
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    ssh_authorized_keys:
# Add your SSH public key here:
      - [SSHKEY]

packages:
  - build-essential
  - stress-ng
  - rt-tests
  - trace-cmd
  - ethtool
  - tcpdump

write_files:
  - path: /etc/systemd/system/rt-setup.service
    permissions: '0644'
    content: |
      [Unit]
      Description=RT kernel setup (IRQ pinning + RT throttling)
      After=network.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/rt-setup.sh

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/rt-setup.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      IFACE="ens8"
      RT_PRIO=98

      # Set vCPU0 runtime to 0 to disable the fair-server and RT throttling
      echo 0 > /sys/kernel/debug/sched/fair_server/cpu0/runtime

      # Find the virtio device backing the interface
      VIRTIO_DEV=$(readlink -f /sys/class/net/$IFACE/device | xargs basename)

      # Find the two IRQ threads for that virtio device and raise their priority
      PIDS=$(ps -eLo pid,comm | awk -v dev="$VIRTIO_DEV" '$2 ~ ("irq/.*" dev "-[io]") {print $1}')

      for PID in $PIDS; do
        chrt -f -p $RT_PRIO $PID
      done

  - path: /etc/default/grub.d/90-local.cfg
    permissions: '0644'
    content: |
      # Set the default commandline
      GRUB_CMDLINE_LINUX_DEFAULT="quiet splash nosmt intel_idle.max_cstate=0 idle=poll nohibernate nowatchdog tsc=reliable audit=0"

  - path: /etc/sysctl.d/99-realtime.conf
    permissions: '0644'
    content: |
      kernel.sched_rt_runtime_us = -1

  - path: /etc/netplan/99-ens8-lowlat.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          ens8:
            dhcp4: false
            dhcp6: false
            accept-ra: false
            link-local: []
            optional: true

runcmd:
  - add-apt-repository -y universe
  - apt update
  - apt install -y ubuntu-realtime
  - netplan generate
  - netplan apply
  - systemctl enable rt-setup.service
  - update-grub
  - reboot
